[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasslink"
version = "0.1.0"
description = "Host SDK for glasslink / esp32-wl-display (MQTT cmd pack + publish)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
tools = ["Pillow>=10", "PyYAML>=6"]

[project.scripts]
glasslink = "glasslink.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glasslink*"]
