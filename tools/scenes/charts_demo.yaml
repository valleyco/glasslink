# Step 22 — host chart recipes (W25)
# Needs firmware with poly/pen/path (Steps 19–21).
#
#   ./tools/wd_scene.py tools/scenes/charts_demo.yaml --device cyd1
name: charts_demo
devices:
  - cyd1
defaults:
  pause: 0.4
steps:
  - clear: { color: 0x1082 }
  - text: { text: "charts", x: 8, y: 8, color: 0xFFE0, scale: 2 }
  # Bars — built inline (same shape as wd_charts.bar_graph)
  - batch:
      ops:
        - fill: { x: 8, y: 40, w: 140, h: 80, color: 0x2104 }
        - fill: { x: 12, y: 90, w: 20, h: 30, color: 0x07E0 }
        - fill: { x: 36, y: 70, w: 20, h: 50, color: 0x07E0 }
        - fill: { x: 60, y: 55, w: 20, h: 65, color: 0x07E0 }
        - fill: { x: 84, y: 100, w: 20, h: 20, color: 0x07E0 }
        - fill: { x: 108, y: 80, w: 20, h: 40, color: 0x07E0 }
        - text: { x: 12, y: 124, color: 0xFFFF, scale: 1, text: "BARS" }
  - sleep: 0.5
  # Gauge-ish wedge + needle via poly/move/line (host recipes in wd_charts.py)
  - batch:
      ops:
        - poly:
            color: 0x8410
            points:
              - [240, 100]
              - [200, 100]
              - [205, 80]
              - [220, 65]
              - [240, 60]
              - [260, 65]
              - [275, 80]
              - [280, 100]
        - poly:
            color: 0xFFE0
            points:
              - [240, 100]
              - [200, 100]
              - [205, 80]
              - [220, 65]
              - [240, 60]
        - move_to: { x: 240, y: 100 }
        - line_to: { x: 255, y: 70, color: 0xF800 }
        - text: { x: 220, y: 124, color: 0xFFFF, scale: 1, text: "GAUGE" }
  - sleep: 0.5
  - batch:
      ops:
        - poly:
            color: 0xF800
            points: [[160, 200], [160, 160], [190, 170], [200, 200]]
        - poly:
            color: 0x07E0
            points: [[160, 200], [200, 200], [195, 220], [170, 225]]
        - poly:
            color: 0x001F
            points: [[160, 200], [170, 225], [140, 220], [130, 200]]
        - text: { x: 140, y: 230, color: 0xFFFF, scale: 1, text: "PIE" }
