# Thin L0 scene for CYD (Step 9). Run:
#   ./tools/wd_scene.py tools/scenes/hello.yaml
#   make scene SCENE=tools/scenes/hello.yaml
name: hello
devices:
  - cyd1
defaults:
  id: 1
  pause: 0.15
steps:
  - clear: { color: 0x0011 }
  - sleep: 0.4
  - banner:
      text: "wl-display scene host"
      x: 0
      y: 0
      w: 320
      h: 28
  - fill: { x: 16, y: 48, w: 88, h: 48, color: 0xF800 }
  - fill: { x: 116, y: 48, w: 88, h: 48, color: 0x07E0 }
  - fill: { x: 216, y: 48, w: 88, h: 48, color: 0x001F }
  - checker: { x: 128, y: 120, w: 64, h: 48, c0: 0xFFFF, c1: 0xF81F }
  - banner:
      text: "Step 9 YAML → MQTT L0"
      x: 8
      y: 200
      w: 304
      h: 28
      bg: [16, 16, 32]
      fg: [180, 220, 255]
